<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Abhigyan Chakraborty</title>
    <!--
      GitHub Pages SPA redirect (rafgraph/spa-github-pages).
      GitHub serves this file for any unknown path (e.g. /blogs/part1 on a
      hard refresh). It encodes the path into a query string and bounces to
      the app root, where index.html decodes it back into the real URL.
      pathSegmentsToKeep = 0 for a user/organization site served at the root.
    -->
    <script>
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
